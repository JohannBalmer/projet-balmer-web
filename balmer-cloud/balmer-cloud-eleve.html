<title>Balmer-Cloud — Entraînement</title>
<!-- Rendu des formules chimiques $\ce{...}$ dans les questions/options/feedback
     (qbank-liaisons-sels-molecules.md et suivants) — même MathJax que le livre
     web (build-web.sh, write_quarto_yml), chargé depuis le même CDN. v1.8
     avait corrigé un premier bug réel (délimiteurs $...$ jamais activés) mais
     restait cassée en pratique : `loader: {load: ['[tex]/mhchem']}` fait
     enregistrer par mhchem lui-même une dépendance différée vers une police
     d'extension séparée (glyphes de liaisons multiples, ex. `\ce{C#C}`),
     chargée depuis un chemin CDN à part (@mathjax/mathjax-mhchem-font-
     extension). Tant que MathJax attend cette ressource annexe, il n'expose
     jamais `MathJax.typesetPromise` — aucune erreur console, juste plus rien
     ne se rend, ni la première formule ni les suivantes. Confirmé et corrigé
     en v1.9 : mhchem est chargé nous-mêmes en <script src> classique (pas via
     le loader dynamique de MathJax) le temps de son exécution, avec
     `MathJax.loader` temporairement neutralisé — son propre code vérifie
     `if (MathJax.loader)` avant d'enregistrer cette dépendance différée, donc
     l'annuler pendant son chargement l'empêche d'être déclarée du tout, sans
     rien retirer de son support de \ce{...} pour autant. `MathJax.startup`
     est mis en pause (`ready: function(){}`) le temps de cette manœuvre, puis
     relancé explicitement une fois mhchem chargé. Testé avec succès sur
     plusieurs rendus successifs (question puis feedback) avant mise en ligne
     — voir Charte_Balmer-Cloud.md pour le détail complet de l'investigation. -->
<script>
window.MathJax = {
  startup: { ready: function() {} },
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    packages: {'[+]': ['mhchem']}
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
<script>
// Neutralise temporairement MathJax.loader le temps du chargement de mhchem :
// voir le commentaire ci-dessus, section "v1.9".
window.__bcSavedLoader = window.MathJax.loader;
window.MathJax.loader = null;
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/input/tex/extensions/mhchem.js"></script>
<script>
window.MathJax.loader = window.__bcSavedLoader;
window.MathJax.startup.defaultReady();
</script>
<style>

<body>

<!-- ── IMPORT SCREEN ── -->
<div class="import-screen" id="import-screen">
  <div class="import-card">
    <div class="import-logo">Balmer<em>-Cloud</em></div>
    <div class="import-sub">Outil élève — v1.9</div>
    <div class="import-icon">📂</div>
    <div class="import-title">Importer une banque de questions</div>
    <div class="import-desc">
      Sélectionnez le fichier <code style="font-family:var(--mono);font-size:12px">qbank-&lt;slug&gt;.md</code>
      fourni par votre enseignant pour commencer votre session d'entraînement.
    </div>
    <button class="import-btn" onclick="document.getElementById('file-input').click()">
      Choisir un fichier .md
    </button>
    <input type="file" id="file-input" accept=".md,.txt" onchange="loadFile(event)">
    <div class="import-error" id="import-error" style="display:none"></div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div class="app" id="app">
  <div class="hdr">
    <div>
      <div class="logo">Balmer<em>-Cloud</em></div>
      <div class="logo-sub">Outil élève</div>
    </div>
    <div class="hdr-right">
      <div class="chapter-badge" id="chapter-badge">—</div>
      <button class="reset-btn" onclick="resetApp()">Changer de banque</button>
      <button class="reset-btn" onclick="resetProgress()">Réinitialiser ma progression</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-v" id="s-cor">0</div><div class="stat-l">Correctes</div></div>
    <div class="stat"><div class="stat-v" id="s-tot">0</div><div class="stat-l">Réponses</div></div>
    <div class="stat"><div class="stat-v" id="s-mas">0</div><div class="stat-l">Maîtrisés</div></div>
  </div>

  <div class="profile">
    <div class="profile-label">Profil de maîtrise</div>
    <div class="concept-grid" id="concept-grid"></div>
  </div>

  <div id="q-area"></div>
</div>

<script>
const LETTERS = ['A','B','C','D'];
const R1L = { macro: 'Macroscopique', parti: 'Particulaire', symbo: 'Symbolique' };
const TYL = { 1: 'Identification', 2: 'Application', 3: 'Transfert' };
const ALGO = { score0: 0.3, gain: 0.15, gainApresErreur: 0.10, perte: 0.25, seuil: 0.8, streak: 3 };
// Livre web public (Charte_Balmer-Cloud.md §7.1.1) — chaque chapitre y est un
// fichier HTML frère nommé par son slug ; **Référence manuel** du qbank ne
// porte que l'ancre {#...} de la sous-section Zone 2 ciblée (charte-balmer.md
// v3.14.0), q.chapitre (frontmatter) fournit le nom de fichier.
const MANUEL_BASE_URL = 'https://johannbalmer.github.io/projet-balmer-web/chapitres/';
// Une ancre valide est un slug kebab-case ASCII (voir ANCHOR_FORMAT_RE côté
// check-qbank-quality.py) — sert à distinguer une ancre migrée d'un ancien
// champ "Section X.X.X" pas encore migré, qu'on affiche alors en texte brut
// plutôt que comme un lien qui n'atterrirait nulle part de précis.
const ANCHOR_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;
function manuelRefHtml(q) {
  if (!q.ref) return '';
  if (q.chapitre && ANCHOR_RE.test(q.ref)) {
    const url = MANUEL_BASE_URL + q.chapitre + '.html#' + q.ref;
    return `<div class="fb-ref">📖 <a href="${url}" target="_blank" rel="noopener">Revoir dans le cours</a></div>`;
  }
  // Repli : ancienne référence texte libre ("Section X.X.X") pas encore
  // migrée vers une ancre {#...} — affichée telle quelle, non cliquable.
  return `<div class="fb-ref fb-ref-plain">📖 ${q.ref}</div>`;
}

let questions = [];
let concepts = [];
let scores = {};
let streaks = {};
let usedQ = {};
// Vrai pour un concept dont la dernière réponse (dans la session en cours)
// était incorrecte — fait passer le prochain gain de +0,15 à +0,10, puis se
// réinitialise. Volontairement non persisté (ne survit pas à un rechargement
// de page) : la charte parle d'une erreur "récente (même session)" (§5.2).
let erreurRecente = {};
let sessionCor = 0, sessionTot = 0;
let currentQ = null, answered = false;
let selected = new Set();
let storageKey = '';

// Retypeset MathJax sur un élément injecté dynamiquement (renderQuestion,
// feedback de validateAnswer) — MathJax ne traite qu'automatiquement le
// contenu présent au chargement de la page, pas ce qu'on insère ensuite via
// innerHTML. Garde silencieuse si le script CDN n'est pas encore chargé
// (connexion lente) : le texte brut $\ce{...}$ reste alors visible plutôt
// que de faire échouer l'affichage de la question.
function typesetMath(el) {
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([el]).catch(() => {});
  }
}

function parseMd(text) {
  // Un nouveau bloc-question démarre à chaque "---" suivi directement de
  // "id:" (le "---" qui clôt le frontmatter d'une question sert aussi de
  // "---" d'ouverture pour la question suivante, cf. §5 de procedure-qbank.md).
  // Un split naïf sur tout "---" isolé séparerait à tort le frontmatter
  // (id, concept, ...) du corps (Question, Options, ...) de chaque question.
  const blocks = text.split(/\n---\n(?=id:\s)/).map(b => b.trim()).filter(b => b.length > 0);
  const qs = [];
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (!b.includes('id:') || !b.includes('concept:')) continue;
    try {
      const get = (field) => {
        const m = b.match(new RegExp(field + ':\\s*(.+)'));
        return m ? m[1].trim() : '';
      };
      const textM = b.match(/\*\*Question\*\*\n([\s\S]+?)\n\n\*\*Options\*\*/);
      const optsM = b.match(/\*\*Options\*\*\n([\s\S]+?)\n\n\*\*Réponse correcte\*\*/);
      const ansM = b.match(/\*\*Réponse correcte\*\*\s*:\s*([ABCD](?:\s*,\s*[ABCD])*)/);
      const fcM = b.match(/\*\*Feedback correct\*\*\n([\s\S]+?)\n\n\*\*Feedback incorrect\*\*/);
      const fwM = b.match(/\*\*Feedback incorrect\*\*\n([\s\S]+?)\n\n\*\*Référence/);
      const refM = b.match(/\*\*Référence manuel\*\*\s*:\s*(.+)/);
      if (!textM || !optsM || !ansM) continue;
      const opts = optsM[1].split('\n').filter(l => l.match(/^- [ABCD]\./)).map(l => l.replace(/^- [ABCD]\.\s*/, ''));
      const fwLines = fwM ? fwM[1].split('\n').filter(l => l.match(/^- Si [ABCD]/)).map(l => l.replace(/^- Si [ABCD]\s*:\s*/, '')) : [];
      const answerLetters = ansM[1].split(',').map(s => s.trim());
      qs.push({
        id: get('id'), concept: get('concept'), chapitre: get('chapitre'), r1: get('r1'),
        type: parseInt(get('type')), niveau: get('niveau'),
        text: textM[1].trim(), options: opts,
        // Ensemble des index corrects (0-3), triés — une question peut porter
        // de 1 à 3 bonnes réponses (jamais 4), cf. Charte_Balmer-Cloud.md §6.2.
        answer: answerLetters.map(l => LETTERS.indexOf(l)).filter(i => i >= 0).sort((a,b) => a-b),
        fc: fcM ? fcM[1].trim() : '',
        fw: fwLines,
        ref: refM ? refM[1].trim() : ''
      });
    } catch(e) { continue; }
  }
  return qs;
}

function getChapterName(text) {
  const m = text.match(/# Banque de questions validées[^\n]*\n# ([^\n]+)/);
  return m ? m[1].trim() : 'Chapitre';
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const parsed = parseMd(text);
    if (!parsed.length) {
      document.getElementById('import-error').textContent = 'Aucune question trouvée — vérifiez le format du fichier.';
      document.getElementById('import-error').style.display = 'block';
      return;
    }
    questions = parsed;
    const chapterName = getChapterName(text);
    storageKey = 'bc-eleve-' + (file.name.replace('.md',''));
    initApp(chapterName);
  };
  reader.readAsText(file);
}

function initApp(chapterName) {
  concepts = [...new Set(questions.map(q => q.concept))];
  const saved = loadScores();
  concepts.forEach(c => {
    scores[c] = saved[c]?.score ?? ALGO.score0;
    streaks[c] = saved[c]?.streak ?? 0;
    usedQ[c] = new Set();
    erreurRecente[c] = false;
  });
  sessionCor = 0; sessionTot = 0;
  document.getElementById('import-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('chapter-badge').textContent = chapterName;
  renderProfile(); renderStats(); renderQuestion();
}

function loadScores() {
  try { const d = localStorage.getItem(storageKey); return d ? JSON.parse(d) : {}; } catch(e) { return {}; }
}
function saveScores() {
  try {
    const d = {};
    concepts.forEach(c => d[c] = { score: scores[c], streak: streaks[c] });
    localStorage.setItem(storageKey, JSON.stringify(d));
  } catch(e) {}
}

function mastered(c) { return scores[c] >= ALGO.seuil && streaks[c] >= ALGO.streak; }
function mastCount() { return concepts.filter(c => mastered(c)).length; }

// Zone d'appartenance du score (Charte_Balmer-Cloud.md §5.1) — le nom "Maîtrisé"
// n'est utilisé que pour un concept réellement mastered() (score ET streak).
// Un score ≥ 0,8 sans le streak requis reste affiché "Bonne maîtrise" : le
// dire "maîtrisé" prématurément induirait l'élève en erreur, puisque
// l'algorithme continuera à lui poser des questions sur ce concept.
function zoneOf(c) {
  if (mastered(c)) return { cls: 'z4', label: 'Maîtrisé' };
  const s = scores[c];
  if (s < 0.3) return { cls: 'z1', label: 'Lacune critique' };
  if (s < 0.6) return { cls: 'z2', label: 'À consolider' };
  return { cls: 'z3', label: 'Bonne maîtrise' };
}

function pickNext() {
  const avail = concepts.filter(c => !mastered(c));
  if (!avail.length) return null;
  avail.sort((a,b) => scores[a] - scores[b]);
  for (const c of avail) {
    const used = usedQ[c];
    const pool = questions.filter(q => q.concept === c && !used.has(q.id));
    if (pool.length) return { q: pool[0], c };
    usedQ[c] = new Set();
    const pool2 = questions.filter(q => q.concept === c);
    if (pool2.length) return { q: pool2[0], c };
  }
  return null;
}

function renderProfile() {
  const g = document.getElementById('concept-grid'); if (!g) return; g.innerHTML = '';
  concepts.forEach(c => {
    const s = scores[c], pct = Math.min(100, Math.max(0, Math.round(s * 100)));
    const zone = zoneOf(c);
    const label = c.replace(/-/g, ' ');
    const d = document.createElement('div'); d.className = 'cpill';
    d.innerHTML = `<div class="cpill-name" title="${label}">${label}</div>
      <div class="cpill-track"><div class="cpill-cursor" style="left:${pct}%"></div></div>
      <div class="cpill-status">
        <span class="cpill-zone-label ${zone.cls}">${zone.cls === 'z4' ? '✓ ' : ''}${zone.label}</span>
        <span class="cpill-pct">${pct}%</span>
      </div>`;
    g.appendChild(d);
  });
}

function renderStats() {
  document.getElementById('s-cor').textContent = sessionCor;
  document.getElementById('s-tot').textContent = sessionTot;
  document.getElementById('s-mas').textContent = mastCount() + '/' + concepts.length;
}

function renderQuestion() {
  const area = document.getElementById('q-area');
  const next = pickNext();
  if (!next) {
    area.innerHTML = `<div class="card done-card">
      <div class="done-icon">🎉</div>
      <div class="done-title">Tous les concepts maîtrisés !</div>
      <div class="done-sub">Score de session : ${sessionCor} / ${sessionTot}<br>Vous pouvez continuer pour consolider vos acquis.</div>
      <button class="btn-restart" onclick="restartSession()">Continuer l'entraînement</button>
    </div>`;
    return;
  }
  currentQ = next.q; answered = false; selected = new Set();
  const q = currentQ;
  area.innerHTML = `<div class="card">
    <div class="badges">
      <span class="badge b-${q.r1}">${R1L[q.r1] || q.r1}</span>
      <span class="badge b-t${q.type}">${TYL[q.type] || 'Type ' + q.type}</span>
      <span class="badge b-concept">${q.concept.replace(/-/g,' ')}</span>
    </div>
    <div class="qtext">${q.text}</div>
    <div class="opts-hint">Plusieurs réponses possibles — sélectionnez de 1 à 3 réponses correctes.</div>
    <div class="opts">
      ${q.options.map((o,i) => `<label class="opt" data-i="${i}">
        <input type="checkbox" class="opt-check" data-i="${i}" onchange="toggleOpt(${i})">
        <span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${o}</span>
      </label>`).join('')}
    </div>
    <div class="validate-row"><button class="btn-validate" id="btn-validate" disabled onclick="validateAnswer()">Valider</button></div>
    <div id="fb-area"></div>
    <div id="next-row"></div>
  </div>`;
  typesetMath(area);
}

function toggleOpt(i) {
  if (answered) return;
  if (selected.has(i)) selected.delete(i); else selected.add(i);
  const btn = document.getElementById('btn-validate');
  if (btn) btn.disabled = selected.size === 0;
}

function validateAnswer() {
  if (answered || selected.size === 0) return;
  answered = true;
  const q = currentQ;
  const correctSet = new Set(q.answer);
  // Tout ou rien : l'ensemble coché doit correspondre exactement à l'ensemble
  // correct — ni case correcte manquante, ni case incorrecte cochée en trop
  // (Charte_Balmer-Cloud.md §5.2).
  const ok = selected.size === correctSet.size && [...selected].every(i => correctSet.has(i));
  sessionTot++;
  if (ok) {
    sessionCor++;
    // Une bonne réponse qui suit immédiatement une erreur (même session, même
    // concept) ne rapporte que +0,10 au lieu de +0,15 — une seule bonne
    // réponse ne suffit pas à effacer une lacune (Charte_Balmer-Cloud.md §5.2).
    // Le palier ne s'applique qu'à cette première bonne réponse : le flag est
    // levé aussitôt après, les bonnes réponses suivantes rapportent +0,15.
    const gain = erreurRecente[q.concept] ? ALGO.gainApresErreur : ALGO.gain;
    scores[q.concept] = Math.min(1, scores[q.concept] + gain);
    streaks[q.concept]++;
    erreurRecente[q.concept] = false;
  } else {
    scores[q.concept] = Math.max(0, scores[q.concept] - ALGO.perte);
    streaks[q.concept] = 0;
    erreurRecente[q.concept] = true;
  }
  usedQ[q.concept].add(q.id);
  saveScores();

  const errorIdx = [];
  document.querySelectorAll('.opt').forEach(el => {
    const i = parseInt(el.dataset.i);
    el.classList.add('answered');
    el.querySelector('.opt-check').disabled = true;
    const isCorrect = correctSet.has(i);
    const isChecked = selected.has(i);
    if (isCorrect && isChecked) el.classList.add('correct');
    else if (isCorrect && !isChecked) { el.classList.add('missed'); errorIdx.push(i); }
    else if (!isCorrect && isChecked) { el.classList.add('wrong'); errorIdx.push(i); }
  });

  const correctLetters = [...correctSet].sort((a,b) => a-b).map(i => LETTERS[i]).join(', ');
  const wrongMsgs = errorIdx.map(i => Array.isArray(q.fw) && q.fw[i] ? q.fw[i] : '').filter(Boolean);
  const mastNow = mastered(q.concept);
  document.getElementById('fb-area').innerHTML = ok
    ? `<div class="fb ok"><strong>Correct.</strong> ${q.fc}${manuelRefHtml(q)}${mastNow ? '<div class="fb-next">✓ Ce concept est maîtrisé — nous passerons à autre chose.</div>' : ''}</div>`
    : `<div class="fb ko"><strong>Réponse${correctSet.size > 1 ? 's correctes' : ' correcte'} : ${correctLetters}.</strong> ${q.fc}${wrongMsgs.length ? `<div class="fb-wrong">${wrongMsgs.join('<br>')}</div>` : ''}${manuelRefHtml(q)}<div class="fb-next">Ce concept sera retravaillé dans les prochaines questions.</div></div>`;

  document.getElementById('btn-validate').style.display = 'none';
  document.getElementById('next-row').innerHTML = `<div class="next-row"><button class="btn-next" onclick="nextQ()">Question suivante →</button></div>`;
  typesetMath(document.getElementById('fb-area'));

  renderProfile(); renderStats();
}

function nextQ() { renderQuestion(); }

function restartSession() {
  concepts.forEach(c => { usedQ[c] = new Set(); });
  renderQuestion();
}

function resetProgress() {
  // Efface la progression persistée (score + streak par concept) pour la
  // banque en cours uniquement — n'affecte pas les autres qbank.md déjà
  // ouverts dans ce navigateur (clé localStorage distincte par fichier).
  if (!storageKey) return;
  const ok = confirm('Réinitialiser votre progression sur cette banque de questions ? Cette action est irréversible.');
  if (!ok) return;
  try { localStorage.removeItem(storageKey); } catch(e) {}
  concepts.forEach(c => { scores[c] = ALGO.score0; streaks[c] = 0; usedQ[c] = new Set(); erreurRecente[c] = false; });
  sessionCor = 0; sessionTot = 0;
  renderProfile(); renderStats(); renderQuestion();
}

function resetApp() {
  questions = []; concepts = []; scores = {}; streaks = {}; usedQ = {};
  sessionCor = 0; sessionTot = 0; currentQ = null; answered = false; selected = new Set();
  document.getElementById('app').style.display = 'none';
  document.getElementById('import-screen').style.display = 'flex';
  document.getElementById('import-error').style.display = 'none';
  document.getElementById('file-input').value = '';
}
</script>
</body>
</html>
