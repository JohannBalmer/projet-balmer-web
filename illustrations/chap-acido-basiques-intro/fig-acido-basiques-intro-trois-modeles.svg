<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ===================== styles / defs ===================== -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .box { fill:#ffffff; stroke:#000000; stroke-width:1.3; }
    .boxtext { font-size:15px; fill:#000000; text-anchor:middle; dominant-baseline:middle; }
    .boxtext-b { font-size:15px; font-weight:bold; fill:#000000; text-anchor:middle; dominant-baseline:middle; }
    .line { stroke:#000000; stroke-width:1.3; fill:none; }
    .arrow { stroke:#000000; stroke-width:1.3; fill:none; marker-end:url(#arrow); }
    .sep { stroke:#b3b3b3; stroke-width:1.1; }
    .eq { font-size:15px; fill:#000000; text-anchor:middle; dominant-baseline:middle; }
    .k { font-size:15px; fill:#000000; text-anchor:middle; dominant-baseline:middle; }
    .acidfill { fill:#f3a6a6; opacity:0.75; }
    .basefill { fill:#a9c8f0; opacity:0.75; }
    .arrfill  { fill:#d9a6df; opacity:0.75; }
    .blbox    { fill:#f3a6a6; stroke:#b23b3b; stroke-width:1.3; }
  </style>

  <!-- ===================== separators ===================== -->
  <line x1="327" y1="30" x2="327" y2="470" class="sep"/>
  <line x1="653" y1="30" x2="653" y2="470" class="sep"/>

  <!-- ===================== top box ===================== -->
  <rect x="415" y="15" width="150" height="34" class="box"/>
  <text x="490" y="33" class="boxtext-b">Acides et bases</text>

  <!-- vertical stem down from top box -->
  <line x1="490" y1="49" x2="490" y2="80" class="line"/>
  <!-- horizontal fan-out -->
  <line x1="160" y1="80" x2="820" y2="80" class="line"/>
  <!-- arrows into Arrhenius (left) and Lewis (right) -->
  <line x1="490" y1="80" x2="235" y2="80" class="arrow"/>
  <line x1="490" y1="80" x2="745" y2="80" class="arrow"/>

  <!-- Arrhenius label (pink/purple oval) -->
  <ellipse cx="160" cy="80" rx="58" ry="17" class="arrfill"/>
  <text x="160" y="80" class="boxtext-b">Arrhenius</text>

  <!-- Bronsted-Lowry label (central, red box, on the stem) -->
  <rect x="425" y="63" width="130" height="32" class="blbox"/>
  <text x="490" y="80" class="boxtext-b">Brønsted-Lowry</text>

  <!-- Lewis label -->
  <text x="820" y="80" class="boxtext-b">Lewis</text>

  <!-- connector from fan-out line down to each column -->
  <line x1="160" y1="97" x2="160" y2="120" class="line"/>
  <line x1="490" y1="95" x2="490" y2="120" class="line"/>
  <line x1="820" y1="80" x2="820" y2="120" class="line"/>

  <!-- ===================== row 2 : acide/base definition boxes ===================== -->
  <!-- Arrhenius column -->
  <line x1="160" y1="120" x2="90" y2="120" class="line"/>
  <line x1="160" y1="120" x2="230" y2="120" class="line"/>
  <line x1="90" y1="120" x2="90" y2="135" class="arrow"/>
  <line x1="230" y1="120" x2="230" y2="135" class="arrow"/>

  <rect x="30" y="135" width="120" height="40" class="box"/>
  <rect x="30" y="135" width="120" height="40" class="acidfill"/>
  <rect x="30" y="135" width="120" height="40" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="90" y="149" class="boxtext-b">Acide</text>
  <text x="90" y="166" class="boxtext-b">d'Arrhenius</text>

  <rect x="170" y="135" width="120" height="40" class="box"/>
  <rect x="170" y="135" width="120" height="40" class="basefill"/>
  <rect x="170" y="135" width="120" height="40" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="230" y="149" class="boxtext-b">Base</text>
  <text x="230" y="166" class="boxtext-b">d'Arrhenius</text>

  <!-- Bronsted-Lowry column -->
  <line x1="490" y1="120" x2="420" y2="120" class="line"/>
  <line x1="490" y1="120" x2="560" y2="120" class="line"/>
  <line x1="420" y1="120" x2="420" y2="135" class="arrow"/>
  <line x1="560" y1="120" x2="560" y2="135" class="arrow"/>

  <rect x="360" y="135" width="120" height="40" class="box"/>
  <rect x="360" y="135" width="120" height="40" class="acidfill"/>
  <rect x="360" y="135" width="120" height="40" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="420" y="149" class="boxtext-b">Acide de</text>
  <text x="420" y="166" class="boxtext-b">Brønsted-Lowry</text>

  <rect x="500" y="135" width="120" height="40" class="box"/>
  <rect x="500" y="135" width="120" height="40" class="basefill"/>
  <rect x="500" y="135" width="120" height="40" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="560" y="149" class="boxtext-b">Base de</text>
  <text x="560" y="166" class="boxtext-b">Brønsted-Lowry</text>

  <!-- Lewis column -->
  <line x1="820" y1="120" x2="750" y2="120" class="line"/>
  <line x1="820" y1="120" x2="890" y2="120" class="line"/>
  <line x1="750" y1="120" x2="750" y2="135" class="arrow"/>
  <line x1="890" y1="120" x2="890" y2="135" class="arrow"/>

  <rect x="690" y="135" width="120" height="40" class="box"/>
  <text x="750" y="149" class="boxtext-b">Acide de</text>
  <text x="750" y="166" class="boxtext-b">Lewis</text>

  <rect x="830" y="135" width="120" height="40" class="box"/>
  <text x="890" y="149" class="boxtext-b">Base de</text>
  <text x="890" y="166" class="boxtext-b">Lewis</text>

  <!-- ===================== row 3 : oval definitions ===================== -->
  <line x1="90" y1="175" x2="90" y2="200" class="line"/>
  <line x1="230" y1="175" x2="230" y2="200" class="line"/>
  <line x1="420" y1="175" x2="420" y2="200" class="line"/>
  <line x1="560" y1="175" x2="560" y2="200" class="line"/>
  <line x1="750" y1="175" x2="750" y2="200" class="line"/>
  <line x1="890" y1="175" x2="890" y2="200" class="line"/>

  <!-- Arrhenius definitions -->
  <ellipse cx="90" cy="220" rx="66" ry="26" class="acidfill"/>
  <text x="90" y="213" class="boxtext">Donneur de H⁺</text>
  <text x="90" y="230" class="boxtext">dans H₂O</text>

  <ellipse cx="230" cy="220" rx="66" ry="26" class="basefill"/>
  <text x="230" y="213" class="boxtext">Donneur de OH⁻</text>
  <text x="230" y="230" class="boxtext">dans H₂O</text>

  <!-- Bronsted-Lowry definitions -->
  <ellipse cx="420" cy="220" rx="66" ry="26" class="acidfill"/>
  <text x="420" y="213" class="boxtext">Donneur de H⁺</text>
  <text x="420" y="230" class="boxtext">dans H₂O</text>

  <ellipse cx="560" cy="220" rx="70" ry="26" class="basefill"/>
  <text x="560" y="213" class="boxtext">Accepteur de H⁺</text>
  <text x="560" y="230" class="boxtext">dans H₂O</text>

  <!-- Lewis definitions (plain text, no fill) -->
  <text x="750" y="213" class="boxtext">Accepteur de doublet</text>
  <text x="750" y="230" class="boxtext">non-liant</text>

  <text x="890" y="213" class="boxtext">Donneur de doublet</text>
  <text x="890" y="230" class="boxtext">non-liant</text>

  <!-- ===================== row 4 : convergence to outcome ===================== -->
  <!-- Arrhenius -> Neutralisation -->
  <line x1="90" y1="246" x2="90" y2="260" class="line"/>
  <line x1="230" y1="246" x2="230" y2="260" class="line"/>
  <line x1="90" y1="260" x2="160" y2="260" class="line"/>
  <line x1="230" y1="260" x2="160" y2="260" class="line"/>
  <line x1="160" y1="260" x2="160" y2="278" class="arrow"/>

  <text x="160" y="300" class="boxtext" font-style="italic">conduisant à</text>
  <rect x="105" y="313" width="110" height="30" class="box"/>
  <text x="160" y="329" class="boxtext-b">Neutralisation</text>

  <text x="160" y="358" class="eq" font-style="italic">conduisant à</text>
  <text x="160" y="380" class="eq">H⁺ + OH⁻ ⟶ H₂O</text>

  <!-- Bronsted-Lowry -> Transfert de proton -->
  <line x1="420" y1="246" x2="420" y2="260" class="line"/>
  <line x1="560" y1="246" x2="560" y2="260" class="line"/>
  <line x1="420" y1="260" x2="490" y2="260" class="line"/>
  <line x1="560" y1="260" x2="490" y2="260" class="line"/>
  <line x1="490" y1="260" x2="490" y2="278" class="arrow"/>

  <text x="490" y="300" class="boxtext" font-style="italic">conduisant à</text>
  <rect x="415" y="313" width="150" height="30" class="box"/>
  <text x="490" y="329" class="boxtext-b">Transfert de proton</text>

  <!-- branch to Ka / Kb (typographic stacking, no lines, matching the Neutralisation branch style) -->
  <line x1="490" y1="343" x2="490" y2="350" class="line"/>
  <line x1="490" y1="350" x2="380" y2="357" class="line"/>
  <line x1="490" y1="350" x2="600" y2="357" class="line"/>

  <text x="380" y="373" class="eq" font-style="italic" font-size="13">conduisant à</text>
  <text x="600" y="373" class="eq" font-style="italic" font-size="13">conduisant à</text>

  <text x="380" y="398" class="eq">H₃O⁺ + A⁻</text>
  <text x="600" y="398" class="eq">BH⁺ + OH⁻</text>

  <text x="380" y="422" class="eq" font-style="italic" font-size="13">conduisant à</text>
  <text x="600" y="422" class="eq" font-style="italic" font-size="13">conduisant à</text>

  <text x="380" y="447" class="k" font-style="italic">K</text>
  <text x="388" y="451" class="k" font-size="11">a</text>
  <text x="600" y="447" class="k" font-style="italic">K</text>
  <text x="608" y="451" class="k" font-size="11">b</text>

</svg>
