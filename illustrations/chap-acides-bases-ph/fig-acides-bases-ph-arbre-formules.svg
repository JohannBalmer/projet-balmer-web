<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" font-family="STIXGeneral,DejaVu Serif,serif"><rect width="680" height="524" fill="white"/><defs><marker id="mv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a1a1a"/></marker></defs><rect x="4" y="8" width="672" height="46" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.3" stroke-dasharray="5 3"/><text xml:space="preserve" x="150.2" y="28.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">Un sel ? Cherchez l'ion qui réagit avec l'eau, puis entrez dans l'arbre</text><text xml:space="preserve" x="197.0" y="46.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">comme acide faible ou base faible ; aucun : pH = 7</text><rect x="230" y="78" width="220" height="30" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="273.8" y="98.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">Qu'y a-t-il en solution ?</text><line x1="340" y1="110" x2="340" y2="126" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="butt"/><line x1="100.0" y1="126" x2="606.0" y2="126" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="butt"/><defs><marker id="m1" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="100.0" y1="126" x2="100.0" y2="142" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m1)"/><defs><marker id="m2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="298.0" y1="126" x2="298.0" y2="142" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m2)"/><defs><marker id="m3" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="465.0" y1="126" x2="465.0" y2="142" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m3)"/><defs><marker id="m4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="606.0" y1="126" x2="606.0" y2="142" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m4)"/><rect x="4" y="142" width="192" height="62" rx="9" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="76.5" y="178.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">un acide</text><rect x="202" y="142" width="192" height="62" rx="9" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="273.7" y="178.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">une base</text><rect x="400" y="142" width="130" height="62" rx="9" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="411.9" y="162.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">un couple AH / A</text><text xml:space="preserve" x="511.4" y="156.7" font-size="9.8" text-anchor="start" fill="#1a1a1a">−</text><text xml:space="preserve" x="431.5" y="178.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">en quantités</text><text xml:space="preserve" x="429.7" y="194.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">comparables</text><rect x="536" y="142" width="140" height="62" rx="9" fill="#e5e5e5" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="575.5" y="170.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">une espèce</text><text xml:space="preserve" x="576.5" y="186.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">amphotère</text><defs><marker id="m5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="100.0" y1="204" x2="100.0" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m5)"/><rect x="4" y="222" width="192" height="30" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="58.8" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">fort ou faible ?</text><line x1="12" y1="252" x2="12" y2="411.0" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="butt"/><defs><marker id="m6" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="12" y1="301.0" x2="26" y2="301.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m6)"/><defs><marker id="m7" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="12" y1="411.0" x2="26" y2="411.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m7)"/><rect x="26" y="270" width="170" height="62" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="96.8" y="290.0" font-size="14.0" text-anchor="start" fill="#555555" font-style="italic">fort :</text><text xml:space="preserve" x="73.1" y="306.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pH = −log c</text><text xml:space="preserve" x="144.0" y="309.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">0</text><text xml:space="preserve" x="63.8" y="322.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">(monoacide fort)</text><rect x="26" y="364" width="170" height="94" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="91.1" y="384.0" font-size="14.0" text-anchor="start" fill="#555555" font-style="italic">faible :</text><text xml:space="preserve" x="47.2" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pH ≈ ½ (pK</text><text xml:space="preserve" x="116.7" y="403.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="121.0" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a"> − log c</text><text xml:space="preserve" x="165.2" y="403.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">0</text><text xml:space="preserve" x="170.1" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">)</text><text xml:space="preserve" x="58.4" y="416.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">valable si α ≤ 5 %,</text><text xml:space="preserve" x="57.6" y="432.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">sinon : équation du</text><text xml:space="preserve" x="74.2" y="448.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">second degré</text><defs><marker id="m8" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="298.0" y1="204" x2="298.0" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m8)"/><rect x="202" y="222" width="192" height="30" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="256.8" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">fort ou faible ?</text><line x1="210" y1="252" x2="210" y2="419.0" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="butt"/><defs><marker id="m9" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="210" y1="309.0" x2="224" y2="309.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m9)"/><defs><marker id="m10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="210" y1="419.0" x2="224" y2="419.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m10)"/><rect x="224" y="270" width="170" height="78" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="294.8" y="290.0" font-size="14.0" text-anchor="start" fill="#555555" font-style="italic">fort :</text><text xml:space="preserve" x="264.3" y="306.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pOH = −log c</text><text xml:space="preserve" x="345.3" y="309.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">0</text><text xml:space="preserve" x="350.2" y="306.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">,</text><text xml:space="preserve" x="249.8" y="322.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">puis pH = 14 − pOH</text><text xml:space="preserve" x="258.8" y="338.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">(monohydroxyde)</text><rect x="224" y="364" width="170" height="110" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="289.1" y="384.0" font-size="14.0" text-anchor="start" fill="#555555" font-style="italic">faible :</text><text xml:space="preserve" x="229.9" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pH ≈ ½ (14 + pK</text><text xml:space="preserve" x="330.0" y="403.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="334.3" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a"> + log c</text><text xml:space="preserve" x="378.5" y="403.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">0</text><text xml:space="preserve" x="383.4" y="400.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">)</text><text xml:space="preserve" x="242.8" y="416.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pK</text><text xml:space="preserve" x="259.9" y="419.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="264.2" y="416.0" font-size="14.0" text-anchor="start" fill="#1a1a1a"> de l'acide conjugué</text><text xml:space="preserve" x="256.4" y="432.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">valable si α ≤ 5 %,</text><text xml:space="preserve" x="255.6" y="448.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">sinon : équation du</text><text xml:space="preserve" x="272.2" y="464.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">second degré</text><defs><marker id="m11" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="465.0" y1="204" x2="465.0" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m11)"/><rect x="400" y="222" width="130" height="46" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="437.4" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pH = pK</text><text xml:space="preserve" x="488.2" y="245.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="413.3" y="258.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">+ log ([A</text><text xml:space="preserve" x="467.2" y="252.7" font-size="9.8" text-anchor="start" fill="#1a1a1a">−</text><text xml:space="preserve" x="473.9" y="258.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">]/[AH])</text><defs><marker id="m12" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="606.0" y1="204" x2="606.0" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#m12)"/><rect x="536" y="222" width="140" height="30" rx="0" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.5"/><text xml:space="preserve" x="542.8" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">pH ≈ ½ (pK</text><text xml:space="preserve" x="612.3" y="245.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="616.7" y="245.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">1</text><text xml:space="preserve" x="621.6" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a"> + pK</text><text xml:space="preserve" x="655.3" y="245.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">a</text><text xml:space="preserve" x="659.6" y="245.1" font-size="9.8" text-anchor="start" fill="#1a1a1a">2</text><text xml:space="preserve" x="664.5" y="242.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">)</text><rect x="4" y="484" width="672" height="32" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.3" stroke-dasharray="5 3"/><text xml:space="preserve" x="180.7" y="505.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">Mélange acide fort + base forte : calculez d'abord l'excès</text></svg>