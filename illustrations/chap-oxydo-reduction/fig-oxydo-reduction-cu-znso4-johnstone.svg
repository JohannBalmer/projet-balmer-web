<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <clipPath id="clip-part">
      <polygon points="51,50 280,50 280,150 100,450 51,450"/>
    </clipPath>
    <clipPath id="clip-macro">
      <polygon points="400,50 630,50 630,450 560,450 400,150"/>
    </clipPath>
    <clipPath id="clip-symb">
      <polygon points="150,480 530,480 590,550 100,550"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- fond blanc -->
  <rect x="0" y="0" width="680" height="680" fill="#ffffff"/>

  <!-- SQUELETTE FIXE — NE PAS MODIFIER -->
  <polygon points="340,185 505,445 175,445"
           fill="none" stroke="#1a3a5c" stroke-width="1.8"/>
  <line x1="340" y1="185" x2="340" y2="45"  stroke="#1a3a5c" stroke-width="1.0"/>
  <line x1="175" y1="445" x2="51"  y2="510" stroke="#1a3a5c" stroke-width="1.0"/>
  <line x1="505" y1="445" x2="629" y2="510" stroke="#1a3a5c" stroke-width="1.0"/>
  <text x="218" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f" transform="rotate(-60,218,308)">Particulaire</text>
  <text x="462" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f" transform="rotate(60,462,308)">Macroscopique</text>
  <text x="340" y="472" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f">Symbolique</text>

  <!-- SUJET -->
  <text x="340" y="342" text-anchor="middle" font-family="Georgia,serif" font-size="20"
        font-weight="bold" font-style="italic" fill="#1a3a5c">Cu / Zn²⁺</text>
  <text x="340" y="366" text-anchor="middle" font-family="Georgia,serif" font-size="12"
        font-style="italic" fill="#1a3a5c">dans ZnSO₄(aq)</text>

  <!-- ZONE PARTICULAIRE -->
  <g clip-path="url(#clip-part)" id="zone-particulaire">

    <circle cx="105" cy="150" r="18" fill="#c88033" stroke="#7a4d1d" stroke-width="1.3"/>
    <text x="105" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">Cu</text>
    <line x1="145" y1="140" x2="165" y2="160" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="145" y1="160" x2="165" y2="140" stroke="#1a1a1a" stroke-width="1.6"/>
    <circle cx="205" cy="150" r="16" fill="#8d8fb8" stroke="#54566f" stroke-width="1.3"/>
    <text x="205" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">Zn²⁺</text>
    <text x="155" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#555555">aucun transfert d'e⁻</text>
    
  </g>

  <!-- ZONE MACROSCOPIQUE -->
  <g clip-path="url(#clip-macro)" id="zone-macroscopique">
<path d="M 512.0,80 L 512.0,177.0 Q 512.0,200 535.0,200
              L 535.0,200 Q 558.0,200 558.0,177.0 L 558.0,80"
              fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <ellipse cx="535" cy="80" rx="23.0" ry="3" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="512.0" y1="84" x2="558.0" y2="84" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="532" y="90" width="6" height="91.0" fill="#555555" stroke="#333333" stroke-width="0.6"/><line x1="590" y1="80" x2="610" y2="100" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="590" y1="100" x2="610" y2="80" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="535" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" fill="#555555">aucun changement observé</text>
  </g>

  <!-- ZONE SYMBOLIQUE -->
  <g clip-path="url(#clip-symb)" id="zone-symbolique">
    <text x="340" y="512" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#1a1a1a">Cu(s) + Zn²⁺(aq) → aucune réaction</text>
  </g>

</svg>
