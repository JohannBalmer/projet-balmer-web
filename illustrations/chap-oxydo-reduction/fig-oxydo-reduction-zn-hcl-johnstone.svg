<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <clipPath id="clip-part">
      <polygon points="51,50 280,50 280,150 100,450 51,450"/>
    </clipPath>
    <clipPath id="clip-macro">
      <polygon points="400,50 630,50 630,450 560,450 400,150"/>
    </clipPath>
    <clipPath id="clip-symb">
      <polygon points="150,480 530,480 590,550 100,550"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- fond blanc -->
  <rect x="0" y="0" width="680" height="680" fill="#ffffff"/>

  <!-- SQUELETTE FIXE — NE PAS MODIFIER -->
  <polygon points="340,185 505,445 175,445"
           fill="none" stroke="#1a3a5c" stroke-width="1.8"/>
  <line x1="340" y1="185" x2="340" y2="45"  stroke="#1a3a5c" stroke-width="1.0"/>
  <line x1="175" y1="445" x2="51"  y2="510" stroke="#1a3a5c" stroke-width="1.0"/>
  <line x1="505" y1="445" x2="629" y2="510" stroke="#1a3a5c" stroke-width="1.0"/>
  <text x="218" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f" transform="rotate(-60,218,308)">Particulaire</text>
  <text x="462" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f" transform="rotate(60,462,308)">Macroscopique</text>
  <text x="340" y="472" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        font-style="italic" fill="#2d6a9f">Symbolique</text>

  <!-- SUJET -->
  <text x="340" y="342" text-anchor="middle" font-family="Georgia,serif" font-size="20"
        font-weight="bold" font-style="italic" fill="#1a3a5c">Zn / H⁺</text>
  <text x="340" y="366" text-anchor="middle" font-family="Georgia,serif" font-size="12"
        font-style="italic" fill="#1a3a5c">dans HCl(aq)</text>

  <!-- ZONE PARTICULAIRE -->
  <g clip-path="url(#clip-part)" id="zone-particulaire">

    <circle cx="110" cy="105" r="18" fill="#8d8fb8" stroke="#54566f" stroke-width="1.3"/>
    <text x="110" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">Zn</text>
    <circle cx="180.0" cy="105" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <text x="180.0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a"></text>
    <circle cx="210.0" cy="105" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <text x="210.0" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a"></text>
    <text x="195" y="132" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">2 H⁺</text>
    <line x1="110" y1="132" x2="110" y2="178" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="120" y="159.0" text-anchor="start" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#1a1a1a">− 2 e⁻</text>
    <line x1="195" y1="132" x2="195" y2="178" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="205" y="159.0" text-anchor="start" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#1a1a1a">+ 2 e⁻</text>
    <circle cx="110" cy="205" r="18" fill="#8d8fb8" stroke="#54566f" stroke-width="1.3"/>
    <text x="110" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">Zn²⁺</text>
    <circle cx="180.0" cy="205" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <text x="180.0" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a"></text>
    <circle cx="210.0" cy="205" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
    <text x="210.0" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a"></text>
    <text x="195" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a1a1a">H₂</text>
    
  </g>

  <!-- ZONE MACROSCOPIQUE -->
  <g clip-path="url(#clip-macro)" id="zone-macroscopique">
<path d="M 512.0,80 L 512.0,177.0 Q 512.0,200 535.0,200
              L 535.0,200 Q 558.0,200 558.0,177.0 L 558.0,80"
              fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <ellipse cx="535" cy="80" rx="23.0" ry="3" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="512.0" y1="84" x2="558.0" y2="84" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="532" y="90" width="6" height="91.0" fill="#555555" stroke="#333333" stroke-width="0.6"/>
    <circle cx="529.0" cy="106.6" r="3.0" fill="none" stroke="#666666" stroke-width="1.1"/>
    <circle cx="520.5" cy="136.3" r="2.6" fill="none" stroke="#666666" stroke-width="1.1"/>
    <circle cx="520.0" cy="134.1" r="2.1" fill="none" stroke="#666666" stroke-width="1.1"/>
    <circle cx="532.7" cy="100.4" r="2.1" fill="none" stroke="#666666" stroke-width="1.1"/>
    <circle cx="532.4" cy="158.7" r="2.2" fill="none" stroke="#666666" stroke-width="1.1"/>
    <circle cx="525.6" cy="143.3" r="3.5" fill="none" stroke="#666666" stroke-width="1.1"/>
    <text x="535" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" fill="#555555">dégagement gazeux (H₂)</text>
    <text x="535" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" fill="#555555">le zinc se dissout</text>
  </g>

  <!-- ZONE SYMBOLIQUE -->
  <g clip-path="url(#clip-symb)" id="zone-symbolique">
    <text x="340" y="512" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#1a1a1a">Zn(s) + 2 H⁺(aq) → Zn²⁺(aq) + H₂(g)</text>
  </g>

</svg>
