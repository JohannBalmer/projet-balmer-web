orable : S créée &gt; 0</text><text xml:space="preserve" x="312.7" y="254.0" font-size="14.0" text-anchor="start" fill="#888888">chaleur Q</text><defs><marker id="m2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#888888"/></marker></defs><line x1="440" y1="284" x2="240" y2="284" stroke="#888888" stroke-width="2.4" marker-end="url(#m2)"/><line x1="322" y1="272" x2="358" y2="296" stroke="#1a1a1a" stroke-width="3.2"/><line x1="322" y1="296" x2="358" y2="272" stroke="#1a1a1a" stroke-width="3.2"/><text xml:space="preserve" x="267.2" y="330.0" font-size="15.0" text-anchor="start" fill="#1a1a1a">impossible : S créée &lt; 0</text><line x1="40" y1="352" x2="640" y2="352" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/><text xml:space="preserve" x="281.3" y="380.0" font-size="15.0" text-anchor="start" fill="#555555" font-style="italic">Niveau particulaire</text><text xml:space="preserve" x="66.7" y="576.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">chaud :</text><text xml:space="preserve" x="47.5" y="596.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">agitation forte</text><text xml:space="preserve" x="219.7" y="576.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">froid :</text><text xml:space="preserve" x="194.9" y="596.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">agitation faible</text><text xml:space="preserve" x="146.1" y="630.0" font-size="15.0" text-anchor="start" fill="#1a1a1a" font-weight="bold">avant</text><defs><marker id="m3" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#1a1a1a"/></marker></defs><line x1="326" y1="475.0" x2="358" y2="475.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#m3)"/><text xml:space="preserve" x="441.5" y="586.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">même agitation moyenne</text><text xml:space="preserve" x="496.2" y="630.0" font-size="15.0" text-anchor="start" fill="#1a1a1a" font-weight="bold">après</text><text xml:space="preserve" x="167.2" y="668.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">L'énergie se disperse sur un plus grand nombre de particules :</text><text xml:space="preserve" x="176.2" y="690.0" font-size="14.0" text-anchor="start" fill="#1a1a1a">davantage de configurations accessibles, donc S créée &gt; 0.</text></svg>